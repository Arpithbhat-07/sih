services:
  - type: web
    name: mplads-sentinel-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      # Set FRONTEND_URL or CORS_ORIGINS to your deployed Vercel domain in Render dashboard:
      # e.g. https://your-project.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: FRONTEND_URL
        sync: false
      - key: SENTINEL_AUTH_SECRET
        generateValue: true
